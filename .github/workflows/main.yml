name: Build Samir AI APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: কোড চেকআউট
        uses: actions/checkout@v4

      - name: জিপ ফাইল আনজিপ করা
        run: |
          if [ -f "samir-ai-project.zip" ]; then
            unzip -o samir-ai-project.zip
          fi

      - name: জাভা সেটআপ (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: অ্যান্ড্রয়েড SDK ও লাইসেন্স সেটআপ
        uses: android-actions/setup-android@v3

      - name: লাইসেন্স স্বয়ংক্রিয় গ্রহণ
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: গ্র্যাডল সেটআপ
        uses: gradle/actions/setup-gradle@v4

      - name: APK তৈরি করা
        run: gradle assembleDebug --stacktrace

      - name: APK আপলোড
        uses: actions/upload-artifact@v4
        with:
          name: SAMIR-AI-APK
          path: app/build/outputs/apk/debug/*.apk
